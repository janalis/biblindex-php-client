name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: biblindex-php-client-runners
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    container:
      image: php:${{ matrix.php }}-cli
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends git unzip

      - name: Install Composer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          rm composer-setup.php

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: bin/phpunit

  release:
    name: GitHub Release + Packagist
    needs: tests
    runs-on: biblindex-php-client-runners
    container:
      image: php:8.4-cli
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: phcorp
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_API_TOKEN" ]; then
            echo "::warning::PACKAGIST_API_TOKEN secret is not set; skipping the Packagist update ping."
            exit 0
          fi
          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}" \
            -d '{"repository":{"url":"https://packagist.org/packages/janalis/biblindex-client"}}'
