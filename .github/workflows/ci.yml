name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    # Self-hosted runners on the local ARC (Actions Runner Controller)
    # scale set; the ARC runner image ships no PHP, so the job runs in a
    # php:<version>-cli container instead of using setup-php.
    runs-on: biblindex-php-client-runners
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    container:
      image: php:${{ matrix.php }}-cli
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends git unzip

      - name: Install Composer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          rm composer-setup.php
          composer --version

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: bin/phpunit

  quality:
    name: Code quality (Mago)
    runs-on: biblindex-php-client-runners
    container:
      image: php:8.4-cli
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends git unzip

      - name: Install Composer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          rm composer-setup.php

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check formatting
        run: bin/mago format --check

      - name: Lint
        run: bin/mago lint

      - name: Analyze
        run: bin/mago analyze

  release:
    name: Auto release
    # Every green build on main is released automatically as the next patch
    # version. Commit message markers adjust behavior: [release:minor],
    # [release:major], [release:skip].
    needs: [tests, quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: biblindex-php-client-runners
    permissions:
      contents: write
    concurrency:
      group: auto-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute and push next version tag
        id: version
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "HEAD is already tagged; skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          message="$(git log -1 --pretty=%B)"
          case "$message" in
            *"[release:skip]"*)
              echo "Commit requests no release; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          current="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          current="${current:-v0.0.0}"
          IFS=. read -r major minor patch <<<"${current#v}"

          case "$message" in
            *"[release:major]"*) major=$((major + 1)); minor=0; patch=0 ;;
            *"[release:minor]"*) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac

          next="v${major}.${minor}.${patch}"
          echo "Releasing ${current} -> ${next}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$next" --message "Release $next"
          git push origin "$next"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true

      - name: Notify Packagist
        if: steps.version.outputs.skip == 'false'
        env:
          PACKAGIST_USERNAME: phcorp
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_API_TOKEN" ]; then
            echo "::warning::PACKAGIST_API_TOKEN secret is not set; skipping the Packagist update ping."
            exit 0
          fi
          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}" \
            -d '{"repository":{"url":"https://packagist.org/packages/janalis/biblindex-client"}}'
