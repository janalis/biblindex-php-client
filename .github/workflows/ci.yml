name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    # Self-hosted runners on the local ARC (Actions Runner Controller)
    # scale set; the ARC runner image ships no PHP, so the job runs in a
    # php:<version>-cli container instead of using setup-php.
    runs-on: biblindex-php-client-runners
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    container:
      image: php:${{ matrix.php }}-cli
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends git unzip

      - name: Install Composer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          rm composer-setup.php
          composer --version

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: bin/phpunit

  quality:
    name: Code quality (Mago)
    runs-on: biblindex-php-client-runners
    container:
      image: php:8.4-cli
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: apt-get update && apt-get install -y --no-install-recommends git unzip

      - name: Install Composer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          rm composer-setup.php

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check formatting
        run: bin/mago format --check

      - name: Lint
        run: bin/mago lint

      - name: Analyze
        run: bin/mago analyze
